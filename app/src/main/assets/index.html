<style>

  :root{
    --bg:#F2EBDD;
    --surface:#FFFCF6;
    --surface-2:#FBF3E4;
    --ink:#2B2118;
    --ink-soft:#6B5E4F;
    --moss:#3F5C3A;
    --moss-dark:#2A3F26;
    --moss-light:#DCE6D6;
    --clay:#9C5B3C;
    --clay-light:#EFDCCB;
    --gold:#AD7F26;
    --gold-light:#F3E6C4;
    --danger:#A23B3B;
    --danger-light:#F3DBDB;
    --line:#E4D8C3;
    --shadow: 0 6px 20px rgba(43,33,24,0.08);
    --shadow-sm: 0 2px 8px rgba(43,33,24,0.06);
    --radius-card: 20px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Tahoma,'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  #phone{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  .display-font{ font-family:Tahoma,'Segoe UI',sans-serif; font-weight:800; }

  /* ---------- Header ---------- */
  header.app-header{
    background:linear-gradient(160deg, var(--moss) 0%, var(--moss-dark) 100%);
    color:#F6F2E7;
    padding:22px 20px 34px;
    position:relative;
    border-radius:0 0 32px 32px;
    box-shadow:var(--shadow);
  }
  header.app-header .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand h1{
    font-family:Tahoma,'Segoe UI',sans-serif;
    font-size:22px;
    font-weight:800;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand small{
    display:block;
    font-size:11px;
    color:#CFE0C8;
    margin-top:2px;
    font-weight:500;
  }
  .mush-badge{ width:40px; height:40px; flex-shrink:0; }
  .header-sub{
    margin-top:18px;
    font-size:13px;
    color:#DCE9D4;
  }

  /* ---------- Main scroll area ---------- */
  main{
    flex:1;
    padding:16px 16px 100px;
    margin-top:-20px;
  }
  .tab-panel{ display:none; animation:fadeUp .25s ease; }
  .tab-panel.active{ display:block; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:16px;
    box-shadow:var(--shadow-sm);
    margin-bottom:14px;
  }
  .cap-card{
    border-radius: 46% 46% var(--radius-card) var(--radius-card) / 30% 30% var(--radius-card) var(--radius-card);
    padding-top:22px;
  }
  .section-title{
    font-size:15px;
    font-weight:800;
    color:var(--moss-dark);
    margin:22px 2px 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title:first-child{ margin-top:4px; }
  .muted{ color:var(--ink-soft); font-size:12.5px; }

  /* Stat grid on dashboard */
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius: 50% 50% var(--radius-card) var(--radius-card) / 34% 34% var(--radius-card) var(--radius-card);
    padding:20px 12px 14px;
    text-align:center;
    box-shadow:var(--shadow-sm);
  }
  .stat-card .num{ font-size:22px; font-weight:800; color:var(--moss-dark); }
  .stat-card .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .stat-card.gold .num{ color:var(--gold); }
  .stat-card.clay .num{ color:var(--clay); }

  /* Buttons */
  .btn{
    border:none;
    border-radius:14px;
    padding:12px 16px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--moss); color:#fff; }
  .btn-gold{ background:var(--gold); color:#fff; }
  .btn-clay{ background:var(--clay); color:#fff; }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); border:1px solid var(--line); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:12.5px; border-radius:10px; }
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .fab{
    position:fixed;
    bottom:calc(86px + var(--safe-bottom));
    left:50%;
    transform:translateX(calc(-230px + 24px));
    background:var(--clay);
    color:#fff;
    width:52px; height:52px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(156,91,60,0.4);
    border:none; cursor:pointer;
    z-index:40;
  }
  @media (max-width:508px){
    .fab{ left:auto; right:22px; transform:none; }
  }

  /* Lists / rows */
  .list-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 4px; border-bottom:1px solid var(--line);
    gap:10px;
  }
  .list-row:last-child{ border-bottom:none; }
  .avatar{
    width:38px;height:38px;border-radius:12px;background:var(--moss-light);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--moss-dark);
    flex-shrink:0; font-size:14px;
  }
  .row-title{ font-weight:700; font-size:14px; }
  .row-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .balance-tag{
    font-size:13px; font-weight:800; white-space:nowrap;
  }
  .balance-pos{ color:var(--moss-dark); }
  .balance-zero{ color:var(--ink-soft); }
  .empty-state{
    text-align:center; padding:36px 12px; color:var(--ink-soft);
  }
  .empty-state svg{ width:52px; height:52px; opacity:.5; margin-bottom:10px; }
  .empty-state .t{ font-weight:700; color:var(--ink); margin-bottom:4px; }

  /* Forms */
  label.f-label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:12px 0 6px; }
  input[type=text], input[type=number], input[type=date], input[type=tel], select, textarea{
    width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--surface); font-family:inherit; font-size:14px; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--moss); outline-offset:1px; border-color:var(--moss); }
  textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  .checkbox-worker{
    display:flex; align-items:center; gap:10px;
    border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;
  }
  .checkbox-worker.checked{ border-color:var(--moss); background:var(--moss-light); }
  .checkbox-worker input[type=checkbox]{ width:18px; height:18px; accent-color:var(--moss); }
  .checkbox-worker .amt{ width:110px; }
  .checkbox-worker .name{ flex:1; font-weight:600; font-size:13.5px; }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(27,20,14,0.5);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.hidden{ display:none; }
  .modal{
    background:var(--bg); width:100%; max-width:460px;
    border-radius:24px 24px 0 0; padding:20px 18px calc(24px + var(--safe-bottom));
    max-height:88vh; overflow-y:auto;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-handle{ width:40px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px; }
  .modal h2{ font-size:18px; margin:0 0 4px; color:var(--moss-dark); }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }

  /* Toast */
  .toast{
    position:fixed; bottom:calc(90px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--moss-dark); color:#fff; padding:11px 18px; border-radius:14px; font-size:13px; font-weight:600;
    box-shadow:var(--shadow); z-index:200; opacity:0; transition:all .25s ease; pointer-events:none; max-width:88%;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.danger{ background:var(--danger); }

  /* Bottom nav */
  nav.bottom-nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:460px;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(8px + var(--safe-bottom));
    z-index:50;
    box-shadow:0 -4px 16px rgba(43,33,24,0.06);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--ink-soft); font-family:inherit; font-size:10px;
    padding:6px 2px; border-radius:14px; cursor:pointer; position:relative;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color:var(--moss-dark); }
  .nav-btn.active::before{
    content:'';
    position:absolute; top:-2px; width:26px; height:14px;
    background:var(--moss-light);
    border-radius:50% 50% 6px 6px / 70% 70% 6px 6px;
    z-index:-1;
  }
  .nav-more{ display:none; }

  /* Reports table */
  table.rep-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.rep-table th, table.rep-table td{ padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

<script>
/* ===================== STATE & STORAGE ===================== */
let state = { workers:[], factories:[], workdays:[], deductions:[], settlements:[], jobTypes:[], loaded:false };
let currentTab = 'dashboard';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmt(n){ n = Math.round(Number(n)||0); return n.toLocaleString('en-US'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ===================== CALENDAR CONVERSION (Jalali / Hijri) =====================
   Pure-JS, no external libraries — works fully offline.
   Jalali algorithm: standard jalaali-js public-domain conversion.
   Hijri algorithm: standard tabular/civil Islamic calendar (arithmetic approximation). */
const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFaDigits(n){ return String(n).replace(/[0-9]/g, d=>FA_DIGITS[d]); }

function div(a,b){ return ~~(a/b); }
function mod(a,b){ return a - ~~(a/b)*b; }
const JALALI_BREAKS = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){
  const bl = JALALI_BREAKS.length; let gy = jy + 621, leapJ = -14, jp = JALALI_BREAKS[0], jm, jump=0, leapG, march, n, i;
  for(i=1;i<bl;i+=1){ jm = JALALI_BREAKS[i]; jump = jm - jp; if(jy < jm) break; leapJ += div(jump,33)*8 + div(mod(jump,33),4); jp = jm; }
  n = jy - jp;
  leapJ += div(n,33)*8 + div(mod(n,33)+3,4);
  if(mod(jump,33)===4 && jump-n===4) leapJ += 1;
  leapG = div(gy,4) - div((div(gy,100)+1)*3,4) - 150;
  march = 20 + leapJ - leapG;
  if(jump-n < 6) n = n - jump + div(jump,33)*33;
  let leap = mod(mod(n+1,33)-1,4);
  if(leap===-1) leap = 4;
  return { leap, gy, march };
}
function g2d(gy,gm,gd){
  let d = div((gy + div(gm-8,6) + 100100) * 1461, 4) + div(153*mod(gm+9,12)+2,5) + gd - 34840408;
  d = d - div(div(gy + 100100 + div(gm-8,6),100)*3,4) + 752;
  return d;
}
function d2g(jdn){
  let j = 4*jdn + 139361631;
  j += div(div(4*jdn + 183187720, 146097)*3, 4)*4 - 3908;
  const i = div(mod(j,1461),4)*5 + 308;
  const gd = div(mod(i,153),5) + 1;
  const gm = mod(div(i,153),12) + 1;
  const gy = div(j,1461) - 100100 + div(8-gm,6);
  return { gy, gm, gd };
}
function j2d(jy,jm,jd){
  const r = jalCal(jy);
  return g2d(r.gy,3,r.march) + (jm-1)*31 - div(jm,7)*(jm-7) + jd - 1;
}
function d2j(jdn){
  const gy = d2g(jdn).gy; let jy = gy - 621;
  const r = jalCal(jy);
  const jdn1f = g2d(gy,3,r.march);
  let k = jdn - jdn1f, jm, jd;
  if(k >= 0){
    if(k <= 185){ jm = 1 + div(k,31); jd = mod(k,31) + 1; return {jy,jm,jd}; }
    else k -= 186;
  } else { jy -= 1; k += 179; if(r.leap===1) k += 1; }
  jm = 7 + div(k,30); jd = mod(k,30) + 1;
  return {jy,jm,jd};
}
function toJalali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }

function gregorianToJDN(y,m,d){
  const a = Math.floor((14-m)/12), y2 = y + 4800 - a, m2 = m + 12*a - 3;
  return d + Math.floor((153*m2+2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045;
}
function toHijri(y,m,d){
  const jdn = gregorianToJDN(y,m,d);
  const ISLAMIC_EPOCH = 1948440;
  let l = jdn - ISLAMIC_EPOCH + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  return { hy:year, hm:month, hd:day };
}
const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const HIJRI_MONTHS = ['محرم','صفر','ربیع‌الاول','ربیع‌الثانی','جمادی‌الاول','جمادی‌الثانی','رجب','شعبان','رمضان','شوال','ذی‌القعده','ذی‌الحجه'];

function parseISO(d){ const [y,m,day] = d.split('-').map(Number); return {y,m,day}; }

// Primary display: Shamsi (Jalali) date, e.g. "۱۰ مرداد ۱۴۰۵"
function fmtDate(d){
  try{
    const {y,m,day} = parseISO(d);
    const j = toJalali(y,m,day);
    return `${toFaDigits(j.jd)} ${JALALI_MONTHS[j.jm-1]} ${toFaDigits(j.jy)}`;
  }catch(e){ return d; }
}
// Hijri (Qamari) date, e.g. "۶ صفر ۱۴۴۸"
function fmtDateHijri(d){
  try{
    const {y,m,day} = parseISO(d);
    const h = toHijri(y,m,day);
    return `${toFaDigits(h.hd)} ${HIJRI_MONTHS[h.hm-1]} ${toFaDigits(h.hy)}`;
  }catch(e){ return ''; }
}
// Gregorian, simple ISO
function fmtDateGregorian(d){ return d; }
// Combined: Shamsi + Qamari + میلادی — used in reports and detail views
function fmtDateFull(d){
  return `${fmtDate(d)} ه.ش · ${fmtDateHijri(d)} ه.ق · ${fmtDateGregorian(d)} م`;
}
// Attach a live Shamsi/Qamari preview under a native (Gregorian) date input
function attachDatePreview(inputId, previewId){
  const inp = document.getElementById(inputId);
  const prev = document.getElementById(previewId);
  if(!inp || !prev) return;
  const update = ()=>{ prev.textContent = inp.value ? fmtDateFull(inp.value) : ''; };
  inp.addEventListener('input', update);
  update();
}

const STORAGE_PREFIX = 'mushroomApp_';
async function loadKey(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
async function saveKey(key, value){
  try{
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){ toast('خطا در ذخیره‌سازی اطلاعات (حافظه مرورگر پر است؟)', true); return false; }
}

async function loadAll(){
  const [w,f,wd,d,s,jt] = await Promise.all([
    loadKey('workers'), loadKey('factories'), loadKey('workdays'), loadKey('deductions'), loadKey('settlements'), loadKey('jobtypes')
  ]);
  state.workers = w; state.factories = f; state.workdays = wd; state.deductions = d; state.settlements = s; state.jobTypes = jt;
  state.loaded = true;
}

/* ===================== CALCULATIONS ===================== */
function workerEarned(id, range){
  return state.workdays
    .filter(wd => inRange(wd.date, range))
    .reduce((sum, wd) => sum + (wd.items.filter(i=>i.workerId===id).reduce((a,i)=>a+i.amount,0)), 0);
}
function workerDeducted(id, range){
  return state.deductions.filter(d=>d.workerId===id && inRange(d.date, range)).reduce((s,d)=>s+d.amount,0);
}
function workerSettled(id, range){
  return state.settlements.filter(x=>x.workerId===id && inRange(x.date, range)).reduce((s,x)=>s+x.amount,0);
}
function workerBalance(id){
  return workerEarned(id) - workerDeducted(id) - workerSettled(id);
}
function inRange(dateStr, range){
  if(!range) return true;
  if(range.from && dateStr < range.from) return false;
  if(range.to && dateStr > range.to) return false;
  return true;
}
function factoryTotalPaid(fid, range){
  return state.workdays.filter(wd=>wd.factoryId===fid && inRange(wd.date, range))
    .reduce((s,wd)=> s + wd.items.reduce((a,i)=>a+i.amount,0), 0);
}
function workerName(id){ const w = state.workers.find(x=>x.id===id); return w? w.name : 'حذف‌شده'; }
function factoryName(id){ if(!id) return '—'; const f = state.factories.find(x=>x.id===id); return f? f.name : 'حذف‌شده'; }
function initials(name){ return (name||'?').trim().slice(0,1); }

/* ===================== TOAST ===================== */
let toastTimer=null;
function toast(msg, isDanger){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('danger', !!isDanger);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2400);
}

/* ===================== MODAL ===================== */
function openModal(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
}

/* ===================== NAV / TABS ===================== */
function goTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  const fab = document.getElementById('fab-btn');
  fab.style.display = ['dashboard','reports','settings'].includes(tab) ? 'none' : 'flex';
  renderTab(tab);
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0,0);
}
function handleFab(){
  if(currentTab==='workers') openWorkerForm();
  else if(currentTab==='factories') openFactoryForm();
  else if(currentTab==='workdays') openWorkdayForm();
  else if(currentTab==='deductions') openDeductionForm();
  else if(currentTab==='settlements') openSettlementForm();
}

function renderTab(tab){
  if(tab==='dashboard') renderDashboard();
  if(tab==='workers') renderWorkers();
  if(tab==='factories') renderFactories();
  if(tab==='workdays') renderWorkdays();
  if(tab==='deductions') renderDeductions();
  if(tab==='settlements') renderSettlements();
  if(tab==='reports') renderReports();
  if(tab==='settings') renderSettings();
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const totalOwed = state.workers.reduce((s,w)=> s + Math.max(workerBalance(w.id),0), 0);
  const events = getRecentEvents(6);
  document.getElementById('header-summary').textContent =
    state.workers.length ? `${state.workers.length} کارگر · ${state.factories.length} کارخانه · جمع بدهی: ${fmt(totalOwed)} تومان` : 'برای شروع، یک کارگر و یک کارخانه اضافه کنید';

  const html = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${state.workers.length}</div><div class="lbl">کارگران</div></div>
      <div class="stat-card clay"><div class="num">${state.factories.length}</div><div class="lbl">کارخانه‌های قارچ</div></div>
      <div class="stat-card gold"><div class="num">${fmt(totalOwed)}</div><div class="lbl">جمع بدهی (تومان)</div></div>
      <div class="stat-card"><div class="num">${state.workdays.length}</div><div class="lbl">ثبت کار روزانه</div></div>
    </div>

    <div class="section-title">🍄 وضعیت کارگران</div>
    <div class="card">
      ${state.workers.length===0 ? emptyState('هنوز کارگری ثبت نشده','از تب «کارگران» یک کارگر اضافه کنید') :
        state.workers.map(w=>{
          const bal = workerBalance(w.id);
          return `<div class="list-row">
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="avatar">${initials(w.name)}</div>
              <div><div class="row-title">${esc(w.name)}</div><div class="row-sub">${w.phone?esc(w.phone):'بدون شماره'}</div></div>
            </div>
            <div class="balance-tag ${bal>0?'balance-pos':'balance-zero'}">${fmt(bal)} ت</div>
          </div>`;
        }).join('')}
    </div>

    <div class="section-title">📋 فعالیت‌های اخیر</div>
    <div class="card">
      ${events.length===0 ? emptyState('فعالیتی ثبت نشده','کار روزانه، کسورات یا تسویه اضافه کنید') :
        events.map(ev=>`<div class="list-row">
          <div><div class="row-title">${ev.title}</div><div class="row-sub">${fmtDate(ev.date)}</div></div>
          <div class="balance-tag" style="color:${ev.color}">${ev.amountLabel}</div>
        </div>`).join('')}
    </div>
  `;
  document.getElementById('tab-dashboard').innerHTML = html;
}

function getRecentEvents(limit){
  const evs = [];
  state.workdays.forEach(wd=>{
    const total = wd.items.reduce((a,i)=>a+i.amount,0);
    evs.push({date:wd.date, title:`کار روزانه · ${factoryName(wd.factoryId)}`, amountLabel:'+'+fmt(total), color:'var(--moss-dark)', ts:wd.id});
  });
  state.deductions.forEach(d=>{
    evs.push({date:d.date, title:`کسر از ${workerName(d.workerId)} · ${d.desc||'کسورات'}`, amountLabel:'-'+fmt(d.amount), color:'var(--danger)', ts:d.id});
  });
  state.settlements.forEach(s=>{
    evs.push({date:s.date, title:`تسویه با ${workerName(s.workerId)}`, amountLabel:'-'+fmt(s.amount), color:'var(--gold)', ts:s.id});
  });
  return evs.sort((a,b)=> (b.date+b.ts).localeCompare(a.date+a.ts)).slice(0,limit);
}

function emptyState(title, sub){
  return `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20c1.5-5 5-8 8-8s6.5 3 8 8"/><circle cx="12" cy="7" r="4"/></svg>
    <div class="t">${title}</div><div>${sub}</div>
  </div>`;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ===================== WORKERS ===================== */
function renderWorkers(){
  const html = `
    <div class="section-title">👷 لیست کارگران</div>
    <div class="card">
      ${state.workers.length===0 ? emptyState('کارگری ثبت نشده','با دکمه + یک کارگر اضافه کنید') :
      state.workers.map(w=>{
        const bal = workerBalance(w.id);
        return `<div class="list-row" onclick="openWorkerDetail('${w.id}')" style="cursor:pointer;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="avatar">${initials(w.name)}</div>

  }
  const selected = wd ? wd.items.map(i=>i.workerId) : [];
  const amounts = {}; if(wd) wd.items.forEach(i=> amounts[i.workerId]=i.amount);

  openModal(`
    <h2>${wd? 'ویرایش کار روزانه' : 'ثبت کار روزانه جدید'}</h2>

function onWdFactoryChange(){
  const factoryId = document.getElementById('f-wd-factory').value;
  const sel = document.getElementById('f-wd-jobtype');
  const types = jobTypesForFactory(factoryId);
  sel.innerHTML = '<option value="">— بدون نوع کار مشخص —</option>' +
    types.map(j=>`<option value="${j.id}">${esc(j.title)} (${fmt(j.amount)} ت)</option>`).join('');
}
function applyJobTypeAmount(){
  const jtId = document.getElementById('f-wd-jobtype').value;
  if(!jtId) return;
  const j = state.jobTypes.find(x=>x.id===jtId);
  if(j) document.getElementById('f-wd-total').value = j.amount;
}
function toggleWdRow(wid){
  const row = document.getElementById('wdrow-'+wid);
  const chk = document.getElementById('wdchk-'+wid);
  row.classList.toggle('checked', chk.checked);
}
function splitEqually(){
  const total = Number(document.getElementById('f-wd-total').value)||0;
  const checked = state.workers.filter(w=> document.getElementById('wdchk-'+w.id).checked);
  if(checked.length===0){ toast('ابتدا کارگران حاضر را انتخاب کنید', true); return; }
  if(total<=0){ toast('مبلغ کل را وارد کنید', true); return; }
  const share = Math.floor(total/checked.length);
  checked.forEach((w,idx)=>{
    const amt = idx===checked.length-1 ? (total - share*(checked.length-1)) : share;
    document.getElementById('wdamt-'+w.id).value = amt;
  });
}
async function saveWorkday(id){
  const date = document.getElementById('f-wd-date').value;
  const factoryId = document.getElementById('f-wd-factory').value;
  const jobTypeId = document.getElementById('f-wd-jobtype').value || null;
  const note = document.getElementById('f-wd-note').value.trim();
  if(!date){ toast('تاریخ را وارد کنید', true); return; }
  const items = [];
  state.workers.forEach(w=>{
    const chk = document.getElementById('wdchk-'+w.id).checked;
    const amt = Number(document.getElementById('wdamt-'+w.id).value)||0;
    if(chk && amt>0) items.push({workerId:w.id, amount:amt});
  });
  if(items.length===0){ toast('حداقل یک کارگر با مبلغ معتبر انتخاب کنید', true); return; }
  if(id){
    const wd = state.workdays.find(x=>x.id===id);
    wd.date=date; wd.factoryId=factoryId; wd.jobTypeId=jobTypeId; wd.items=items; wd.note=note;
  }else{
    state.workdays.push({id:uid(), date, factoryId, jobTypeId, items, note});
  }
  await saveKey('workdays', state.workdays);
  closeModal(); toast('کار روزانه ثبت شد ✓'); renderTab(currentTab);
}
async function deleteWorkday(id){
  if(!confirm('این رکورد حذف شود؟')) return;
  state.workdays = state.workdays.filter(x=>x.id!==id);
  await saveKey('workdays', state.workdays);
  closeModal(); toast('حذف شد'); renderTab(currentTab);
}

      <option value="">— بدون کارخانه —</option>

      <div>
        <label class="f-label">مقدار (کیلوگرم)</label>
        <input type="number" id="f-ded-kg" value="${d&&d.kg?d.kg:''}" oninput="calcDedAmount()" placeholder="مثلاً 5">
      </div>
      <div>
        <label class="f-label">قیمت هر کیلو (تومان)</label>
        <input type="number" id="f-ded-price" value="${d&&d.pricePerKg?d.pricePerKg:''}" oninput="calcDedAmount()" placeholder="مثلاً 80000">
      </div>

function calcDedAmount(){
  const kg = Number(document.getElementById('f-ded-kg').value)||0;
  const price = Number(document.getElementById('f-ded-price').value)||0;
  if(kg>0 && price>0) document.getElementById('f-ded-amount').value = Math.round(kg*price);
}
async function saveDeduction(id){
  const workerId = document.getElementById('f-ded-worker').value;
  const date = document.getElementById('f-ded-date').value;
  const factoryId = document.getElementById('f-ded-factory').value || null;
  const desc = document.getElementById('f-ded-desc').value.trim();
  const kg = Number(document.getElementById('f-ded-kg').value)||0;
  const pricePerKg = Number(document.getElementById('f-ded-price').value)||0;
  const amount = Number(document.getElementById('f-ded-amount').value)||0;
  if(!date){ toast('تاریخ را وارد کنید', true); return; }
  if(amount<=0){ toast('مبلغ کسر باید بزرگتر از صفر باشد', true); return; }
  if(id){
    const d = state.deductions.find(x=>x.id===id);
    Object.assign(d, {workerId,date,factoryId,desc,kg,pricePerKg,amount});
  }else{
    state.deductions.push({id:uid(), workerId,date,factoryId,desc,kg,pricePerKg,amount});
  }
  await saveKey('deductions', state.deductions);
  closeModal(); toast('کسر ثبت شد ✓'); renderTab(currentTab);
}
async function deleteDeduction(id){
  if(!confirm('این کسر حذف شود؟')) return;
  state.deductions = state.deductions.filter(x=>x.id!==id);
  await saveKey('deductions', state.deductions);
  closeModal(); toast('حذف شد'); renderTab(currentTab);
}

          return `<div class="pill ${bal>0?'pill-moss':'pill-gold'}" style="cursor:pointer;" onclick="openSettlementForm('${w.id}')">${esc(w.name)}: ${fmt(bal)} ت</div>`;

function maskCard(c){
  c = (c||'').replace(/\s+/g,'');
  if(c.length<=4) return c;
  return c.slice(0,4)+' •••• •••• '+c.slice(-4);
}
function methodLabel(m){
  return {card:'💳 کارت به کارت', cash:'💵 نقدی', cheque:'🧾 چک', other:'✳️ سایر'}[m||'card'] || '💳 کارت به کارت';
}
function methodPillClass(m){
  return {card:'pill-moss', cash:'pill-gold', cheque:'pill-clay', other:'pill-clay'}[m||'card'] || 'pill-moss';
}
function settlementSubtitle(s){
  const m = s.method || 'card';
  if(m==='card') return `${s.bankName?esc(s.bankName)+' · ':''}${s.cardNumber?maskCard(s.cardNumber):'بدون شماره کارت'}`;
  if(m==='cheque') return `${s.chequeBank?esc(s.chequeBank)+' · ':''}چک ${s.chequeNumber?'شماره '+esc(s.chequeNumber):''}${s.chequeDueDate?' · سررسید '+fmtDate(s.chequeDueDate):''}`;
  if(m==='cash') return 'پرداخت نقدی';
  return s.note? esc(s.note) : 'سایر روش‌ها';
}

function onStMethodChange(){
  const m = document.getElementById('f-st-method').value;
  ['card','cheque','cash','other'].forEach(k=>{

  });
}
function updateStBalance(){
  const wid = document.getElementById('f-st-worker').value;
  const bal = workerBalance(wid);
  document.getElementById('f-st-balance-hint').textContent = `مانده فعلی این کارگر: ${fmt(bal)} تومان`;
  const amtField = document.getElementById('f-st-amount');
  if(!amtField.value) amtField.value = bal>0? bal : '';
  const amount = Number(amtField.value)||0;
  const remaining = bal - amount;
  const hint = document.getElementById('f-st-remaining-hint');
  if(remaining===0) hint.innerHTML = '✅ مانده بعد از این تسویه: <span style="color:var(--moss-dark)">۰ (تسویه کامل)</span>';
  else if(remaining>0) hint.innerHTML = `مانده بعد از این تسویه: <span style="color:var(--clay)">${fmt(remaining)} تومان (هنوز طلبکار است)</span>`;
  else hint.innerHTML = `مانده بعد از این تسویه: <span style="color:var(--danger)">${fmt(Math.abs(remaining))} تومان (پرداخت اضافه)</span>`;
}
async function saveSettlement(id){
  const workerId = document.getElementById('f-st-worker').value;
  const date = document.getElementById('f-st-date').value;
  const amount = Number(document.getElementById('f-st-amount').value)||0;
  const method = document.getElementById('f-st-method').value;
  const note = document.getElementById('f-st-note').value.trim();
  if(!date){ toast('تاریخ را وارد کنید', true); return; }
  if(amount<=0){ toast('مبلغ تسویه باید بزرگتر از صفر باشد', true); return; }

  const data = {workerId, date, amount, method, note,
    bankName:'', cardNumber:'', cardHolder:'', chequeBank:'', chequeNumber:'', chequeDueDate:''};
  if(method==='card'){
    data.bankName = document.getElementById('f-st-bank').value.trim();
    data.cardNumber = document.getElementById('f-st-card').value.trim();
    data.cardHolder = document.getElementById('f-st-holder').value.trim();
  } else if(method==='cheque'){
    data.chequeBank = document.getElementById('f-st-cheque-bank').value.trim();
    data.chequeNumber = document.getElementById('f-st-cheque-number').value.trim();
    data.chequeDueDate = document.getElementById('f-st-cheque-due').value;
  }

  let saved;
  if(id){
    const s = state.settlements.find(x=>x.id===id);
    Object.assign(s, data);
    saved = s;
  }else{
    saved = {id:uid(), ...data};
    state.settlements.push(saved);
  }
  await saveKey('settlements', state.settlements);
  toast('تسویه ثبت شد ✓');
  renderTab(currentTab);
  openSettlementReceipt(saved.id);
}
async function deleteSettlement(id){
  if(!confirm('این تسویه حذف شود؟')) return;
  state.settlements = state.settlements.filter(x=>x.id!==id);
  await saveKey('settlements', state.settlements);
  closeModal(); toast('حذف شد'); renderTab(currentTab);
}

      <hr class="sep">
      <div class="list-row"><div class="row-title">مانده حساب پس از این تسویه</div><div style="font-weight:800; color:${remaining>0?'var(--clay)':'var(--moss-dark)'};">${fmt(remaining)} تومان</div></div>

function generateReport(){
  const from = document.getElementById('rep-from')?.value || '';
  const to = document.getElementById('rep-to')?.value || '';
  const workerId = document.getElementById('rep-worker')?.value || '';
  const factoryId = document.getElementById('rep-factory')?.value || '';
  const range = {from, to};

  const wdFiltered = state.workdays.filter(wd=> inRange(wd.date,range) && (!factoryId || wd.factoryId===factoryId));
  const dedFiltered = state.deductions.filter(d=> inRange(d.date,range) && (!factoryId || d.factoryId===factoryId));
  const setFiltered = state.settlements.filter(s=> inRange(s.date,range));

  const workerList = workerId ? state.workers.filter(w=>w.id===workerId) : state.workers;
  const factoryList = factoryId ? state.factories.filter(f=>f.id===factoryId) : state.factories;

  let workerRows = workerList.map(w=>{
    const e = wdFiltered.reduce((sum,wd)=> sum + wd.items.filter(i=>i.workerId===w.id).reduce((a,i)=>a+i.amount,0), 0);
    const d = dedFiltered.filter(x=>x.workerId===w.id).reduce((s,x)=>s+x.amount,0);
    const s = workerId ? setFiltered.filter(x=>x.workerId===w.id).reduce((s2,x)=>s2+x.amount,0) : setFiltered.filter(x=>x.workerId===w.id).reduce((s2,x)=>s2+x.amount,0);
    return {name:w.name, e, d, s, bal:e-d-s};
  });
  let factoryRows = factoryList.map(f=>{
    const total = wdFiltered.filter(wd=>wd.factoryId===f.id).reduce((s,wd)=> s + wd.items.reduce((a,i)=>a+i.amount,0), 0);
    return {name:f.name, total};
  });

  // Job-type breakdown (within the filtered work days)
  const jtTotals = {};
  wdFiltered.forEach(wd=>{
    const key = wd.jobTypeId ? jobTypeName(wd.jobTypeId) : 'بدون نوع کار مشخص';
    const total = wd.items.reduce((a,i)=>a+i.amount,0);
    jtTotals[key] = (jtTotals[key]||0) + total;
  });
  const jtRows = Object.entries(jtTotals).sort((a,b)=>b[1]-a[1]);

  const totalEarned = workerRows.reduce((a,r)=>a+r.e,0);
  const totalDed = workerRows.reduce((a,r)=>a+r.d,0);
  const totalSettled = workerRows.reduce((a,r)=>a+r.s,0);

  const periodLine = (from||to)
    ? `از ${from?fmtDate(from):'ابتدا'} تا ${to?fmtDate(to):'اکنون'} <span class="muted">(${from?fmtDateHijri(from):'—'} تا ${to?fmtDateHijri(to):'—'} قمری)</span>`
    : 'کل بازه‌ی زمانی ثبت‌شده';

  const html = `
    <p class="muted" style="text-align:center; margin:6px 0 14px;">${periodLine}</p>

    <div class="section-title">جمع‌بندی کارگران</div>
    <div class="card">
      ${workerRows.length===0? emptyState('داده‌ای نیست','') : `
      <table class="rep-table">
        <thead><tr><th>کارگر</th><th>دریافتی</th><th>کسورات</th><th>تسویه</th><th>مانده</th></tr></thead>
        <tbody>
          ${workerRows.map(r=>`<tr><td>${esc(r.name)}</td><td>${fmt(r.e)}</td><td style="color:var(--danger)">${fmt(r.d)}</td><td style="color:var(--gold)">${fmt(r.s)}</td><td style="font-weight:800;">${fmt(r.bal)}</td></tr>`).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="section-title">جمع‌بندی کارخانه‌ها</div>
    <div class="card">
      ${factoryRows.length===0? emptyState('داده‌ای نیست','') : `
      <table class="rep-table">
        <thead><tr><th>کارخانه</th><th>مجموع پرداختی</th></tr></thead>
        <tbody>${factoryRows.map(r=>`<tr><td>${esc(r.name)}</td><td>${fmt(r.total)}</td></tr>`).join('')}</tbody>
      </table>`}
    </div>

    <div class="section-title">جمع‌بندی بر اساس نوع کار</div>
    <div class="card">
      ${jtRows.length===0? emptyState('داده‌ای نیست','') : `
      <table class="rep-table">
        <thead><tr><th>نوع کار</th><th>مجموع مبلغ</th></tr></thead>
        <tbody>${jtRows.map(([name,total])=>`<tr><td>${esc(name)}</td><td>${fmt(total)}</td></tr>`).join('')}</tbody>
      </table>`}
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="num">${fmt(totalEarned)}</div><div class="lbl">جمع دریافتی</div></div>
      <div class="stat-card gold"><div class="num">${fmt(totalSettled)}</div><div class="lbl">جمع تسویه‌شده</div></div>
    </div>
  `;
  document.getElementById('report-output').innerHTML = html;
}

/* ===================== SETTINGS / BACKUP ===================== */
function renderSettings(){
  const html = `
    <div class="section-title">💾 پشتیبان‌گیری و بازیابی</div>
    <div class="card">
      <p class="muted">از تمام اطلاعات (کارگران، کارخانه‌ها، کارهای روزانه، کسورات و تسویه‌ها) یک فایل پشتیبان تهیه کنید.</p>
      <button class="btn btn-primary btn-block" onclick="exportBackup()">📤 دانلود فایل پشتیبان</button>
      <hr class="sep">
      <p class="muted">برای بازیابی، فایل پشتیبان قبلی را انتخاب کنید. اطلاعات فعلی با فایل پشتیبان جایگزین می‌شود.</p>
      <input type="file" id="restore-file" accept="application/json" style="margin-bottom:10px;">
      <button class="btn btn-clay btn-block" onclick="importBackup()">📥 بازیابی از فایل</button>
    </div>
    <div class="section-title">⚠️ منطقه خطر</div>
    <div class="card">
      <p class="muted">تمام اطلاعات برنامه برای همیشه پاک می‌شود. این کار قابل بازگشت نیست، مگر اینکه پشتیبان داشته باشید.</p>
      <button class="btn btn-danger btn-block" onclick="resetAllData()">پاک کردن کامل اطلاعات</button>
    </div>
    <div class="section-title">درباره</div>
    <div class="card muted">
      نسخه ۱.۰ · اطلاعات به‌صورت خودکار در همین دستگاه ذخیره می‌شود. برای اطمینان کامل، مرتب از قسمت پشتیبان‌گیری فایل خروجی بگیرید.
    </div>
  `;
  document.getElementById('tab-settings').innerHTML = html;
}
function exportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    workers: state.workers, factories: state.factories,
    workdays: state.workdays, deductions: state.deductions, settlements: state.settlements,
    jobTypes: state.jobTypes
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'پشتیبان-حساب-قارچ-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('فایل پشتیبان دانلود شد ✓');
}
function importBackup(){
  const inp = document.getElementById('restore-file');
  if(!inp.files || !inp.files[0]){ toast('یک فایل انتخاب کنید', true); return; }
  if(!confirm('اطلاعات فعلی با فایل پشتیبان جایگزین می‌شود. ادامه می‌دهید؟')) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      state.workers = data.workers || [];
      state.factories = data.factories || [];
      state.workdays = data.workdays || [];
      state.deductions = data.deductions || [];
      state.settlements = data.settlements || [];
      state.jobTypes = data.jobTypes || [];
      await Promise.all([
        saveKey('workers', state.workers), saveKey('factories', state.factories),
        saveKey('workdays', state.workdays), saveKey('deductions', state.deductions),
        saveKey('settlements', state.settlements), saveKey('jobtypes', state.jobTypes)
      ]);
      toast('بازیابی با موفقیت انجام شد ✓');
      renderTab(currentTab);
    }catch(err){ toast('فایل پشتیبان معتبر نیست', true); }
  };
  reader.readAsText(inp.files[0]);
}
async function resetAllData(){
  if(!confirm('آیا مطمئن هستید؟ همه اطلاعات برای همیشه حذف می‌شود.')) return;
  if(!confirm('تأیید نهایی: تمام کارگران، کارخانه‌ها، کارها، کسورات و تسویه‌ها پاک شود؟')) return;
  state.workers=[]; state.factories=[]; state.workdays=[]; state.deductions=[]; state.settlements=[]; state.jobTypes=[];
  await Promise.all([saveKey('workers',[]),saveKey('factories',[]),saveKey('workdays',[]),saveKey('deductions',[]),saveKey('settlements',[]),saveKey('jobtypes',[])]);
  toast('همه اطلاعات پاک شد'); renderTab(currentTab);
}

/* ===================== INIT ===================== */
const WEEKDAY_FA = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
async function init(){
  const today = todayStr();
  const weekday = WEEKDAY_FA[new Date().getDay()];
  document.getElementById('header-date').textContent = `${weekday} ${fmtDate(today)} ه.ش`;
  await loadAll();
  goTab('dashboard');
}
init();
</script>
