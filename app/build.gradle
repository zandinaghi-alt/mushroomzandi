apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// در GitHub Actions اگر keystore.properties وجود نداشت، از این متغیرهای محیطی (Secrets) استفاده می‌شود
def ksStoreFile     = keystoreProperties['storeFile']     ?: 'release.keystore'
def ksStorePassword = keystoreProperties['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD')
def ksKeyAlias      = keystoreProperties['keyAlias']      ?: System.getenv('KEY_ALIAS')
def ksKeyPassword   = keystoreProperties['keyPassword']   ?: System.getenv('KEY_PASSWORD')

android {
    namespace 'com.mushroomfarm.accounting'
    compileSdk 34

    defaultConfig {
        applicationId "com.mushroomfarm.accounting"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(ksStoreFile)
            storePassword ksStorePassword
            keyAlias ksKeyAlias
            keyPassword ksKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // debug build is signed automatically with the default debug key
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
